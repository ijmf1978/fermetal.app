<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestor de Visitas</title>
<meta name="description" content="Registro de visitas de vendedores con GPS">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top" hidden>
  <div class="brand">
    <img src="icon.svg" alt="" width="34" height="34">
    <div><b id="hdrEmpresa">Gestor de Visitas</b><small id="hdrPerfil"></small></div>
  </div>
  <div class="top-actions">
    <span id="netDot" class="net" title="Estado de conexión"></span>
    <button class="icon-btn" data-act="sync" id="btnSync" title="Sincronizar" aria-label="Sincronizar">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1M18 3v4.5h-4.5M6 21v-4.5h4.5"/></svg>
      <i id="pendBadge" class="badge-dot" hidden></i>
    </button>
  </div>
</header>

<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Secciones" hidden></nav>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true"><div id="modalBody"></div></div>
</div>
<div id="lightbox" class="lightbox" hidden><img alt="Foto de evidencia"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
